<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de la Serpiente - Modo Claro</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }
        canvas {
            image-rendering: pixelated;
        }
        /* Custom soft shadows for light theme */
        .light-glow {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0, 0, 0, 0.04);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between items-center p-4 select-none">

    <!-- Header Section -->
    <header class="w-full max-w-md flex justify-between items-center py-3 px-4 bg-white/90 backdrop-blur-md rounded-2xl border border-slate-200 shadow-sm mt-2">
        <div class="flex items-center gap-2">
            <div class="w-9 h-9 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-600 border border-emerald-500/20">
                <i class="fa-solid fa-gamepad text-lg"></i>
            </div>
            <h1 class="font-bold text-lg tracking-wide text-slate-900">Snake<span class="text-emerald-500">JS</span></h1>
        </div>
        <div class="flex gap-4">
            <div class="flex flex-col items-end">
                <span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Puntuación</span>
                <span id="current-score" class="font-black text-emerald-600 text-lg leading-none">0</span>
            </div>
            <div class="w-px bg-slate-200"></div>
            <div class="flex flex-col items-end">
                <span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Récord</span>
                <span id="high-score" class="font-black text-amber-500 text-lg leading-none">0</span>
            </div>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-md my-4 flex flex-col items-center relative">
        <div class="relative w-full aspect-square bg-white rounded-3xl overflow-hidden border border-slate-200 light-glow flex items-center justify-center">
            
            <!-- Game Canvas -->
            <canvas id="gameCanvas" class="w-full h-full block bg-slate-50/50"></canvas>

            <!-- Start / Pause / Game Over Overlays -->
            <div id="overlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center transition-all duration-300 z-20">
                <div id="overlay-icon" class="w-16 h-16 rounded-2xl bg-emerald-500/15 flex items-center justify-center text-emerald-600 text-3xl mb-4 border border-emerald-500/30">
                    <i class="fa-solid fa-shield-cat"></i>
                </div>
                <h2 id="overlay-title" class="text-2xl font-black text-slate-900 mb-2 tracking-tight">Snake Clásico</h2>
                <p id="overlay-desc" class="text-slate-500 text-sm mb-6 max-w-xs">Usa las flechas del teclado, WASD o los botones táctiles para moverte. ¡Evita chocar contra las paredes y tu propia cola!</p>
                
                <button id="action-btn" onclick="startGame()" class="w-full max-w-[200px] bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-emerald-500/25 transition-all duration-200 flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-play"></i> Jugar Ahora
                </button>
            </div>
        </div>
    </main>

    <!-- Controls & Action Panel -->
    <footer class="w-full max-w-md flex flex-col gap-4 mb-2">
        <!-- Game Controls Bar -->
        <div class="flex justify-between items-center px-2">
            <button onclick="togglePause()" id="pause-btn" class="flex items-center gap-2 text-xs font-semibold text-slate-600 hover:text-slate-900 bg-white hover:bg-slate-100 border border-slate-200 py-2.5 px-4 rounded-xl transition-all shadow-sm cursor-pointer">
                <i class="fa-solid fa-pause"></i> Pausa
            </button>
            <div class="flex items-center gap-2 text-xs text-slate-500">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="speed-indicator">Velocidad: 1x</span>
            </div>
        </div>

        <!-- Touch D-Pad for Mobile/Tablet -->
        <div class="grid grid-cols-3 gap-2 bg-white p-4 rounded-3xl border border-slate-200 shadow-sm max-w-[280px] mx-auto w-full">
            <div></div>
            <button ontouchstart="handleTouchDir('UP')" onclick="changeDirection('UP')" class="h-14 bg-slate-100 hover:bg-slate-200 active:bg-emerald-500 active:text-white text-slate-700 rounded-2xl flex items-center justify-center text-lg transition-colors shadow-sm cursor-pointer">
                <i class="fa-solid fa-chevron-up"></i>
            </button>
            <div></div>
            
            <button ontouchstart="handleTouchDir('LEFT')" onclick="changeDirection('LEFT')" class="h-14 bg-slate-100 hover:bg-slate-200 active:bg-emerald-500 active:text-white text-slate-700 rounded-2xl flex items-center justify-center text-lg transition-colors shadow-sm cursor-pointer">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <button ontouchstart="handleTouchDir('DOWN')" onclick="changeDirection('DOWN')" class="h-14 bg-slate-100 hover:bg-slate-200 active:bg-emerald-500 active:text-white text-slate-700 rounded-2xl flex items-center justify-center text-lg transition-colors shadow-sm cursor-pointer">
                <i class="fa-solid fa-chevron-down"></i>
            </button>
            <button ontouchstart="handleTouchDir('RIGHT')" onclick="changeDirection('RIGHT')" class="h-14 bg-slate-100 hover:bg-slate-200 active:bg-emerald-500 active:text-white text-slate-700 rounded-2xl flex items-center justify-center text-lg transition-colors shadow-sm cursor-pointer">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </footer>

    <script>
        // DOM Elements
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const currentScoreEl = document.getElementById('current-score');
        const highScoreEl = document.getElementById('high-score');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const overlayIcon = document.getElementById('overlay-icon');
        const actionBtn = document.getElementById('action-btn');
        const pauseBtn = document.getElementById('pause-btn');
        const speedIndicator = document.getElementById('speed-indicator');

        // Grid & Dimensions Settings
        const GRID_SIZE = 20; // 20x20 game board grid
        let tileSize = 20;

        // Game State Variables
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = 1;
        let dy = 0;
        let nextDx = 1;
        let nextDy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snake_high_score_light') || 0;
        let gameInterval = null;
        let gameSpeed = 110; // Initial milliseconds per frame
        let gameState = 'IDLE'; // IDLE, RUNNING, PAUSED, GAMEOVER

        // Initialize High Score UI
        highScoreEl.textContent = highScore;

        // Resize Canvas dynamically to maintain crisp grid ratio inside container
        function resizeCanvas() {
            const containerWidth = canvas.parentElement.clientWidth;
            canvas.width = containerWidth;
            canvas.height = containerWidth;
            tileSize = containerWidth / GRID_SIZE;
            draw();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Keyboard Event Listeners
        window.addEventListener('keydown', e => {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection('UP');
                    e.preventDefault();
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection('DOWN');
                    e.preventDefault();
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection('LEFT');
                    e.preventDefault();
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection('RIGHT');
                    e.preventDefault();
                    break;
                case ' ':
                    togglePause();
                    e.preventDefault();
                    break;
            }
        });

        // Direction Control Handler with Anti-Reverse protection
        function changeDirection(dir) {
            if (gameState !== 'RUNNING' && gameState !== 'PAUSED') return;
            if (gameState === 'PAUSED') togglePause();

            if (dir === 'UP' && dy === 0) {
                nextDx = 0; nextDy = -1;
            } else if (dir === 'DOWN' && dy === 0) {
                nextDx = 0; nextDy = 1;
            } else if (dir === 'LEFT' && dx === 0) {
                nextDx = -1; nextDy = 0;
            } else if (dir === 'RIGHT' && dx === 0) {
                nextDx = 1; nextDy = 0;
            }
        }

        function handleTouchDir(dir) {
            changeDirection(dir);
        }

        // Start or Restart Game
        function startGame() {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            score = 0;
            currentScoreEl.textContent = score;
            dx = 1;
            dy = 0;
            nextDx = 1;
            nextDy = 0;
            gameSpeed = 110;
            speedIndicator.textContent = 'Velocidad: 1x';
            
            spawnFood();
            
            overlay.classList.add('opacity-0', 'pointer-events-none');
            gameState = 'RUNNING';
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        // Toggle Pause State
        function togglePause() {
            if (gameState === 'RUNNING') {
                gameState = 'PAUSED';
                clearInterval(gameInterval);
                overlayTitle.textContent = 'Juego Pausado';
                overlayDesc.textContent = 'Toma un respiro. Tu partida está guardada.';
                overlayIcon.innerHTML = '<i class="fa-solid fa-pause"></i>';
                actionBtn.innerHTML = '<i class="fa-solid fa-play"></i> Continuar';
                overlay.classList.remove('opacity-0', 'pointer-events-none');
                pauseBtn.innerHTML = '<i class="fa-solid fa-play"></i> Reanudar';
            } else if (gameState === 'PAUSED') {
                overlay.classList.add('opacity-0', 'pointer-events-none');
                gameState = 'RUNNING';
                gameInterval = setInterval(gameLoop, gameSpeed);
                pauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pausa';
            }
        }

        // Generate Random Position for Food
        function spawnFood() {
            let valid = false;
            while (!valid) {
                food.x = Math.floor(Math.random() * GRID_SIZE);
                food.y = Math.floor(Math.random() * GRID_SIZE);
                
                valid = true;
                for (let part of snake) {
                    if (part.x === food.x && part.y === food.y) {
                        valid = false;
                        break;
                    }
                }
            }
        }

        // Main Core Game Loop
        function gameLoop() {
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Check Collision with Walls
            if (head.x < 0 || head.x >= GRID_SIZE || head.y < 0 || head.y >= GRID_SIZE) {
                triggerGameOver();
                return;
            }

            // Check Collision with Self
            for (let part of snake) {
                if (head.x === part.x && head.y === part.y) {
                    triggerGameOver();
                    return;
                }
            }

            snake.unshift(head);

            // Check Food Eaten
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                currentScoreEl.textContent = score;

                if (score > highScore) {
                    highScore = score;
                    highScoreEl.textContent = highScore;
                    localStorage.setItem('snake_high_score_light', highScore);
                }

                // Dynamic speed scaling as score increases
                if (score % 50 === 0 && gameSpeed > 60) {
                    gameSpeed -= 10;
                    clearInterval(gameInterval);
                    gameInterval = setInterval(gameLoop, gameSpeed);
                    let multiplier = (110 / gameSpeed).toFixed(1);
                    speedIndicator.textContent = `Velocidad: ${multiplier}x`;
                }

                spawnFood();
            } else {
                snake.pop();
            }

            draw();
        }

        // Handle Game Over sequence
        function triggerGameOver() {
            clearInterval(gameInterval);
            gameState = 'GAMEOVER';
            
            overlayTitle.textContent = '¡Game Over!';
            overlayDesc.textContent = `Puntuación final: ${score}. ¿Quieres intentar batir tu récord?`;
            overlayIcon.innerHTML = '<i class="fa-solid fa-skull text-rose-500"></i>';
            actionBtn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Jugar de Nuevo';
            pauseBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pausa';
            overlay.classList.remove('opacity-0', 'pointer-events-none');
        }

        // Render Graphics on Canvas with Light Mode Aesthetics
        function draw() {
            // Background fill
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw subtle light grid lines
            ctx.strokeStyle = '#e2e8f0';
            ctx.lineWidth = 0.5;
            for (let i = 0; i < GRID_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(i * tileSize, 0);
                ctx.lineTo(i * tileSize, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * tileSize);
                ctx.lineTo(canvas.width, i * tileSize);
                ctx.stroke();
            }

            // Draw Food (Vibrant Rose/Red)
            ctx.fillStyle = '#f43f5e';
            ctx.beginPath();
            ctx.roundRect(
                food.x * tileSize + 2, 
                food.y * tileSize + 2, 
                tileSize - 4, 
                tileSize - 4, 
                6
            );
            ctx.fill();

            // Draw Snake Segments (Vibrant Emerald Green)
            snake.forEach((part, index) => {
                if (index === 0) {
                    ctx.fillStyle = '#059669'; // Head (Darker Emerald)
                } else {
                    ctx.fillStyle = '#10b981'; // Body (Emerald)
                }

                ctx.beginPath();
                ctx.roundRect(
                    part.x * tileSize + 1.5, 
                    part.y * tileSize + 1.5, 
                    tileSize - 3, 
                    tileSize - 3, 
                    index === 0 ? 6 : 4
                );
                ctx.fill();
            });
        }

        // Draw initial static board preview
        draw();
    </script>
</body>
</html>
