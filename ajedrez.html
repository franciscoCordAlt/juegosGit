<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajedrez Royale</title>
<style>
    * { box-sizing: border-box; }
    :root {
        --bg: #0b0d12;
        --panel: #131720;
        --panel-2: #191e29;
        --gold: #d8b56a;
        --gold-light: #f1d898;
        --text: #f5f1e8;
        --muted: #a6a9b2;
        --light: #e7d8b8;
        --dark: #725d48;
        --accent: #8f6b31;
        --danger: #c95656;
        --green: #668d6d;
        --shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    body.light-theme {
        --bg: #eee9df;
        --panel: #faf8f3;
        --panel-2: #f2eee5;
        --gold: #9a722d;
        --gold-light: #7b5b25;
        --text: #252525;
        --muted: #68645d;
        --light: #f1e6ce;
        --dark: #9b8060;
        --accent: #8d6a31;
        --danger: #ad4747;
        --green: #55795d;
        --shadow: 0 20px 55px rgba(75,62,42,.18);
        background:
            radial-gradient(circle at 50% 0%, rgba(154,114,45,.13), transparent 34%),
            radial-gradient(circle at 100% 100%, rgba(155,128,96,.14), transparent 30%),
            var(--bg);
    }

    body.light-theme .board-wrap {
        background: linear-gradient(145deg, #fffdf7, #d9d2c4);
    }

    body.light-theme .side {
        background: linear-gradient(145deg, rgba(250,248,243,.98), rgba(235,230,220,.98));
    }

    body.light-theme .status {
        background: rgba(154,114,45,.07);
    }

    body.light-theme .clock-box,
    body.light-theme .moves {
        background: #f7f4ed;
        border-color: #d8d0c1;
    }

    body.light-theme button {
        color: #292722;
        background: #ebe5d9;
        border-color: rgba(154,114,45,.3);
    }

    body.light-theme button:hover {
        background: #e1d9ca;
    }

    body.light-theme button.primary {
        color: #fff;
        background: linear-gradient(135deg, #8e6b36, #b08a49);
    }

    body.light-theme .move {
        color: #37342e;
    }

    body.light-theme .promotion-box {
        background: #f7f4ed;
    }

    body {
        margin: 0;
        min-height: 100vh;
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
        background:
            radial-gradient(circle at 50% 0%, rgba(216,181,106,.12), transparent 34%),
            radial-gradient(circle at 100% 100%, rgba(114,93,72,.12), transparent 30%),
            var(--bg);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 28px;
    }

    .game {
        width: min(1180px, 100%);
        display: grid;
        grid-template-columns: minmax(500px, 760px) 300px;
        gap: 28px;
        align-items: start;
    }

    .left {
        display: flex;
        flex-direction: column;
        gap: 16px;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        padding: 0 4px;
    }

    .brand {
        letter-spacing: 5px;
        text-transform: uppercase;
        font-size: 12px;
        color: var(--gold);
        margin-bottom: 7px;
    }

    h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 500;
        letter-spacing: 1px;
    }

    .subtitle {
        color: var(--muted);
        font-family: Arial, sans-serif;
        font-size: 12px;
        margin-top: 7px;
    }

    .turn {
        border: 1px solid rgba(216,181,106,.28);
        background: rgba(19,23,32,.8);
        padding: 10px 14px;
        border-radius: 10px;
        font-family: Arial, sans-serif;
        font-size: 12px;
        color: var(--gold-light);
    }

    .board-wrap {
        background: linear-gradient(145deg, #242a35, #0f1218);
        border: 1px solid rgba(216,181,106,.25);
        padding: 14px;
        border-radius: 16px;
        box-shadow: var(--shadow);
    }

    .board {
        width: 100%;
        max-width: 760px;
        aspect-ratio: 1 / 1;
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        grid-template-rows: repeat(8, minmax(0, 1fr));
        overflow: hidden;
        border-radius: 8px;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
        contain: layout paint;
    }

    .square {
        position: relative;
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        user-select: none;
        transition: filter .15s ease;
    }

    .square.light { background: var(--light); }
    .square.dark { background: var(--dark); }

    .square:hover { filter: brightness(1.08); }

    .square.selected {
        box-shadow: inset 0 0 0 4px rgba(216,181,106,.9);
    }

    .square.last {
        box-shadow: inset 0 0 0 999px rgba(216,181,106,.18);
    }

    .square.check {
        box-shadow: inset 0 0 0 999px rgba(201,86,86,.55);
    }

    .square.legal::after {
        content: "";
        width: 18%;
        height: 18%;
        border-radius: 50%;
        background: rgba(27,29,33,.38);
        position: absolute;
    }

    .square.capture::after {
        content: "";
        position: absolute;
        width: 74%;
        height: 74%;
        border-radius: 50%;
        border: 5px solid rgba(190,70,64,.65);
    }

    .piece {
        position: relative;
        z-index: 2;
        font-family: "Times New Roman", serif;
        font-size: clamp(38px, 7vw, 72px);
        line-height: 1;
        transition: transform .12s ease;
        text-shadow: 0 3px 4px rgba(0,0,0,.28);
    }

    .square:hover .piece { transform: translateY(-2px); }

    .white-piece {
        color: #fffaf0;
        text-shadow: 0 2px 0 #bcae91, 0 4px 7px rgba(0,0,0,.42);
    }

    .black-piece {
        color: #1b1d22;
        text-shadow: 0 2px 0 #555964, 0 4px 7px rgba(0,0,0,.5);
    }

    .coord {
        position: absolute;
        font: 10px Arial, sans-serif;
        opacity: .65;
        font-weight: bold;
    }

    .rank { left: 5px; top: 4px; }
    .file { right: 5px; bottom: 4px; }

    .light .coord { color: #5b4c3a; }
    .dark .coord { color: #e9d8b7; }

    .side {
        background: linear-gradient(145deg, rgba(25,30,41,.96), rgba(14,17,24,.96));
        border: 1px solid rgba(216,181,106,.22);
        border-radius: 16px;
        padding: 20px;
        box-shadow: var(--shadow);
    }

    .side h2 {
        margin: 0 0 16px;
        font-size: 21px;
        font-weight: 500;
    }

    .status {
        background: rgba(216,181,106,.07);
        border: 1px solid rgba(216,181,106,.15);
        border-radius: 10px;
        padding: 13px;
        font-family: Arial, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        margin-bottom: 16px;
    }

    .clock {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 16px;
    }

    .clock-box {
        background: #0d1016;
        border: 1px solid #252b36;
        padding: 11px;
        border-radius: 9px;
        text-align: center;
        font-family: Arial, sans-serif;
    }

    .clock-box span {
        display: block;
        color: var(--muted);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 4px;
    }

    .clock-box strong {
        font-size: 19px;
        color: var(--gold-light);
    }

    .moves-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 18px 0 8px;
        color: var(--gold-light);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }

    .moves {
        height: 210px;
        overflow-y: auto;
        background: #0c0f14;
        border: 1px solid #242a34;
        border-radius: 9px;
        padding: 8px;
        font-family: Arial, sans-serif;
        font-size: 12px;
    }

    .move-row {
        display: grid;
        grid-template-columns: 34px 1fr 1fr;
        padding: 7px 5px;
        border-bottom: 1px solid rgba(255,255,255,.045);
    }

    .move-row:last-child { border-bottom: 0; }
    .move-number { color: #737985; }
    .move { color: #e9e5db; }

    .buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 14px;
    }

    .buttons button {
        min-height: 42px;
    }

    button {
        border: 1px solid rgba(216,181,106,.28);
        color: var(--text);
        background: #1a1f29;
        padding: 11px 8px;
        border-radius: 8px;
        cursor: pointer;
        font-family: Arial, sans-serif;
        font-size: 12px;
        transition: .15s;
    }

    button:hover {
        background: #252b37;
        border-color: rgba(216,181,106,.55);
    }

    button.primary {
        background: linear-gradient(135deg, #8e6b36, #b08a49);
        color: #fff;
        border-color: #caa45f;
    }

    button.primary:hover { filter: brightness(1.1); }

    .promotion {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.72);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 10;
        backdrop-filter: blur(5px);
    }

    .promotion.show { display: flex; }

    .promotion-box {
        width: min(380px, 90%);
        background: #151a23;
        border: 1px solid rgba(216,181,106,.35);
        border-radius: 14px;
        padding: 22px;
        text-align: center;
        box-shadow: var(--shadow);
    }

    .promotion-box h3 { margin: 0 0 16px; font-weight: 500; }

    .promotion-options {
        display: grid;
        grid-template-columns: repeat(4,1fr);
        gap: 8px;
    }

    .promotion-options button {
        font-size: 42px;
        padding: 10px;
        font-family: "Times New Roman", serif;
    }

    @media (max-width: 900px) {
        body { padding: 14px; align-items: flex-start; }
        .game { grid-template-columns: 1fr; max-width: 720px; }
        .side { width: 100%; }
        .moves { height: 150px; }
        .board-wrap { width: 100%; }
    }

    @media (max-width: 560px) {
        .board-wrap { padding: 8px; }
        .game { gap: 15px; }
        header { align-items: flex-start; gap: 10px; }
        .turn { font-size: 10px; }
        .piece { font-size: 11vw; }
    }
</style>
</head>
<body>

<div class="game">
    <main class="left">
        <header>
            <div>
                <div class="brand">Royal Edition</div>
                <h1>Ajedrez</h1>
                <div class="subtitle">Una partida clásica, presentada con elegancia.</div>
            </div>
            <div class="turn" id="turnLabel">Turno: Blancas</div>
        </header>

        <div class="board-wrap">
            <div class="board" id="board"></div>
        </div>
    </main>

    <aside class="side">
        <h2>Partida</h2>

        <div class="status" id="status">
            Las blancas comienzan. Selecciona una pieza para ver sus movimientos.
        </div>

        <div class="clock">
            <div class="clock-box">
                <span>Blancas</span>
                <strong id="whiteClock">10:00</strong>
            </div>
            <div class="clock-box">
                <span>Negras</span>
                <strong id="blackClock">10:00</strong>
            </div>
        </div>

        <div class="moves-title">
            <span>Movimientos</span>
            <span id="moveCount">0</span>
        </div>

        <div class="moves" id="moves">
            <div style="color:#666d78;text-align:center;padding:20px 5px;">
                Aún no hay movimientos.
            </div>
        </div>

        <div class="buttons">
            <button class="primary" id="newGame">Nueva partida</button>
            <button id="undo">Deshacer</button>
            <button id="flip">Girar tablero</button>
            <button id="theme">☀️ Tema claro</button>
            <button id="mode">🤖 Jugar contra IA</button>
            <button id="resign">Abandonar</button>
        </div>
    </aside>
</div>

<div class="promotion" id="promotion">
    <div class="promotion-box">
        <h3>Elige la promoción</h3>
        <div class="promotion-options" id="promotionOptions"></div>
    </div>
</div>

<script>
"use strict";

const boardEl = document.getElementById("board");
const statusEl = document.getElementById("status");
const turnLabel = document.getElementById("turnLabel");
const movesEl = document.getElementById("moves");
const moveCountEl = document.getElementById("moveCount");
const promotionEl = document.getElementById("promotion");
const promotionOptionsEl = document.getElementById("promotionOptions");
const whiteClockEl = document.getElementById("whiteClock");
const blackClockEl = document.getElementById("blackClock");

const PIECES = {
    w: { k:"♔", q:"♕", r:"♖", b:"♗", n:"♘", p:"♙" },
    b: { k:"♚", q:"♛", r:"♜", b:"♝", n:"♞", p:"♟" }
};

const NAMES = { k:"Rey", q:"Dama", r:"Torre", b:"Alfil", n:"Caballo", p:"Peón" };
const FILES = "abcdefgh";

let board, turn, selected, legalMoves, history, lastMove, flipped;
let pendingPromotion = null;
let gameOver = false;
let singlePlayer = false;
const humanColor = "w";
let aiTimer = null;
let clocks = { w:600, b:600 };
let timer = null;

function initialBoard() {
    const b = Array.from({length:8}, () => Array(8).fill(null));
    const back = ["r","n","b","q","k","b","n","r"];
    for (let c=0;c<8;c++) {
        b[0][c] = {color:"b", type:back[c]};
        b[1][c] = {color:"b", type:"p"};
        b[6][c] = {color:"w", type:"p"};
        b[7][c] = {color:"w", type:back[c]};
    }
    return b;
}

function cloneBoard(b) {
    return b.map(row => row.map(p => p ? {...p} : null));
}

function inside(r,c) { return r>=0 && r<8 && c>=0 && c<8; }
function opposite(color) { return color === "w" ? "b" : "w"; }
function squareName(r,c) { return FILES[c] + (8-r); }

function render() {
    boardEl.innerHTML = "";
    const rows = flipped ? [...Array(8).keys()].reverse() : [...Array(8).keys()];
    const cols = flipped ? [...Array(8).keys()].reverse() : [...Array(8).keys()];

    rows.forEach(r => cols.forEach(c => {
        const sq = document.createElement("div");
        sq.className = "square " + ((r+c)%2===0 ? "light":"dark");
        sq.dataset.r = r; sq.dataset.c = c;

        if (selected && selected.r===r && selected.c===c) sq.classList.add("selected");
        if (lastMove && ((lastMove.from.r===r && lastMove.from.c===c) ||
                         (lastMove.to.r===r && lastMove.to.c===c))) sq.classList.add("last");

        const lm = legalMoves.find(m => m.r===r && m.c===c);
        if (lm) sq.classList.add(board[r][c] ? "capture" : "legal");

        if (board[r][c] && board[r][c].type==="k" &&
            board[r][c].color===turn && isInCheck(board, turn)) sq.classList.add("check");

        if ((flipped ? c===7 : c===0)) {
            const rank = document.createElement("span");
            rank.className = "coord rank";
            rank.textContent = 8-r;
            sq.appendChild(rank);
        }
        if ((flipped ? r===0 : r===7)) {
            const file = document.createElement("span");
            file.className = "coord file";
            file.textContent = FILES[c];
            sq.appendChild(file);
        }

        const p = board[r][c];
        if (p) {
            const piece = document.createElement("span");
            piece.className = "piece " + (p.color==="w" ? "white-piece":"black-piece");
            piece.textContent = PIECES[p.color][p.type];
            sq.appendChild(piece);
        }

        sq.addEventListener("click", () => clickSquare(r,c));
        boardEl.appendChild(sq);
    }));

    const turnName = turn==="w" ? "Blancas" : "Negras";
    turnLabel.textContent = singlePlayer && turn !== humanColor
        ? "Turno: Computadora"
        : "Turno: " + turnName;
    updateClocks();
}

function clickSquare(r,c) {
    if (gameOver || pendingPromotion) return;
    if (singlePlayer && turn !== humanColor) return;

    const p = board[r][c];

    if (selected) {
        const move = legalMoves.find(m => m.r===r && m.c===c);
        if (move) {
            makeMove(selected.r, selected.c, r, c);
            return;
        }
    }

    if (p && p.color===turn) {
        selected = {r,c};
        legalMoves = getLegalMoves(board,r,c);
        render();
    } else {
        selected = null;
        legalMoves = [];
        render();
    }
}

function pseudoMoves(b,r,c, attacksOnly=false) {
    const p = b[r][c];
    if (!p) return [];
    const result = [];

    const add = (rr,cc) => {
        if (!inside(rr,cc)) return false;
        if (!b[rr][cc]) { result.push({r:rr,c:cc}); return true; }
        if (b[rr][cc].color !== p.color) result.push({r:rr,c:cc});
        return false;
    };

    if (p.type==="p") {
        const dir = p.color==="w" ? -1 : 1;
        const start = p.color==="w" ? 6 : 1;

        if (!attacksOnly) {
            if (inside(r+dir,c) && !b[r+dir][c]) {
                result.push({r:r+dir,c});
                if (r===start && !b[r+2*dir][c])
                    result.push({r:r+2*dir,c});
            }
        }
        for (const dc of [-1,1]) {
            const rr=r+dir, cc=c+dc;
            if (inside(rr,cc)) {
                if (attacksOnly || (b[rr][cc] && b[rr][cc].color!==p.color))
                    result.push({r:rr,c:cc});
            }
        }
        return result;
    }

    if (p.type==="n") {
        [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]
        .forEach(([dr,dc]) => {
            if (!inside(r+dr,c+dc)) return;
            if (!b[r+dr][c+dc] || b[r+dr][c+dc].color!==p.color)
                result.push({r:r+dr,c:c+dc});
        });
        return result;
    }

    if (p.type==="k") {
        for (let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) {
            if (!dr && !dc) continue;
            add(r+dr,c+dc);
        }
        if (!attacksOnly && !isInCheck(b,p.color)) {
            // Castling
            if (canCastle(b,p.color,"k")) result.push({r,c:c+2, castle:"k"});
            if (canCastle(b,p.color,"q")) result.push({r,c:c-2, castle:"q"});
        }
        return result;
    }

    const dirs = [];
    if (p.type==="b" || p.type==="q")
        dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
    if (p.type==="r" || p.type==="q")
        dirs.push([-1,0],[1,0],[0,-1],[0,1]);

    dirs.forEach(([dr,dc]) => {
        let rr=r+dr, cc=c+dc;
        while (inside(rr,cc)) {
            if (!add(rr,cc)) break;
            rr+=dr; cc+=dc;
        }
    });
    return result;
}

function findKing(b,color) {
    for (let r=0;r<8;r++) for(let c=0;c<8;c++)
        if (b[r][c]?.color===color && b[r][c]?.type==="k") return {r,c};
    return null;
}

function isSquareAttacked(b,r,c,byColor) {
    for (let rr=0;rr<8;rr++) for(let cc=0;cc<8;cc++) {
        const p=b[rr][cc];
        if (p && p.color===byColor) {
            const attacks=pseudoMoves(b,rr,cc,true);
            if (attacks.some(x=>x.r===r && x.c===c)) return true;
        }
    }
    return false;
}

function isInCheck(b,color) {
    const k=findKing(b,color);
    return k ? isSquareAttacked(b,k.r,k.c,opposite(color)) : true;
}

function applyMove(b,fr,fc,tr,tc, extra={}) {
    const nb=cloneBoard(b);
    const p=nb[fr][fc];
    nb[tr][tc]=p;
    nb[fr][fc]=null;

    // En passant
    if (p.type==="p" && fc!==tc && !b[tr][tc]) {
        nb[fr][tc]=null;
    }

    // Castling
    if (p.type==="k" && Math.abs(tc-fc)===2) {
        if (tc>fc) {
            nb[fr][5]=nb[fr][7]; nb[fr][7]=null;
        } else {
            nb[fr][3]=nb[fr][0]; nb[fr][0]=null;
        }
    }

    return nb;
}

function canCastle(b,color,side) {
    const row=color==="w"?7:0;
    const king=b[row][4];
    if (!king || king.type!=="k" || king.color!==color || king.moved) return false;

    const rookCol=side==="k"?7:0;
    const rook=b[row][rookCol];
    if (!rook || rook.type!=="r" || rook.color!==color || rook.moved) return false;

    const between=side==="k"?[5,6]:[1,2,3];
    if (between.some(c=>b[row][c])) return false;

    const safe=side==="k"?[4,5,6]:[4,3,2];
    if (safe.some(c=>isSquareAttacked(b,row,c,opposite(color)))) return false;
    return true;
}

function getLegalMoves(b,r,c) {
    const p=b[r][c];
    if (!p) return [];
    const pseudo=pseudoMoves(b,r,c);
    const legal=[];

    pseudo.forEach(m=>{
        const nb=applyMove(b,r,c,m.r,m.c);
        // En passant/castling are handled in applyMove.
        if (!isInCheck(nb,p.color)) legal.push(m);
    });
    return legal;
}

function allLegalMoves(b,color) {
    const all=[];
    for(let r=0;r<8;r++) for(let c=0;c<8;c++) {
        if(b[r][c]?.color===color) {
            getLegalMoves(b,r,c).forEach(m=>all.push({fr:r,fc:c,tr:m.r,tc:m.c,castle:m.castle}));
        }
    }
    return all;
}

function notation(fr,fc,tr,tc,p,captured,castle,promotion) {
    if (castle==="k") return "O-O";
    if (castle==="q") return "O-O-O";
    const pieceLetter=p.type==="p" ? "" : p.type.toUpperCase();
    const capture=captured ? "x" : "";
    const pawnFile=p.type==="p" && captured ? FILES[fc] : "";
    let s=pieceLetter+pawnFile+capture+squareName(tr,tc);
    if(promotion) s+="="+promotion.toUpperCase();
    return s;
}

function makeMove(fr,fc,tr,tc) {
    const p=board[fr][fc];
    const target=board[tr][tc];
    const moveInfo=legalMoves.find(m=>m.r===tr && m.c===tc);
    const castle=moveInfo?.castle;

    history.push({
        board:cloneBoard(board),
        turn,
        lastMove:lastMove ? {...lastMove,from:{...lastMove.from},to:{...lastMove.to}} : null,
        clocks:{...clocks},
        notation: null
    });

    board=applyMove(board,fr,fc,tr,tc,{});
    board[tr][tc].moved=true;

    // En passant target
    const ep = p.type==="p" && Math.abs(tr-fr)===2 ? {r:(fr+tr)/2,c:fc} : null;
    board._enPassant = ep;

    if (castle==="k") {
        board[tr][5].moved=true;
    } else if (castle==="q") {
        board[tr][3].moved=true;
    }

    let promotion=null;
    if (p.type==="p" && (tr===0 || tr===7)) {
        pendingPromotion={fr,fc,tr,tc,color:p.color,captured:!!target,castle};
        showPromotion(p.color);
        selected=null; legalMoves=[];
        render();
        return;
    }

    finishMove(fr,fc,tr,tc,p,target,castle,promotion);
}

function finishMove(fr,fc,tr,tc,p,target,castle,promotion) {
    const hist=history[history.length-1];
    hist.notation=notation(fr,fc,tr,tc,p,target,castle,promotion);

    lastMove={from:{r:fr,c:fc},to:{r:tr,c:tc}};
    turn=opposite(turn);
    selected=null; legalMoves=[];

    const check=isInCheck(board,turn);
    const moves=allLegalMoves(board,turn);

    if (moves.length===0) {
        gameOver=true;
        stopTimer();
        if(check) {
            statusEl.innerHTML="<strong>Jaque mate.</strong> " + (turn==="w" ? "Las negras" : "Las blancas") + " ganan la partida.";
        } else {
            statusEl.innerHTML="<strong>Tablas.</strong> No hay movimientos legales.";
        }
    } else if(check) {
        statusEl.innerHTML="<strong>Jaque.</strong> El rey de " + (turn==="w" ? "las blancas" : "las negras") + " está amenazado.";
    } else {
        statusEl.textContent="Turno de " + (turn==="w" ? "las blancas." : "las negras.") + " Selecciona una pieza.";
    }

    render();
    renderMoves();

    if (singlePlayer && !gameOver && turn !== humanColor) {
        scheduleAI();
    }
}

function showPromotion(color) {
    promotionOptionsEl.innerHTML="";
    ["q","r","b","n"].forEach(type=>{
        const btn=document.createElement("button");
        btn.textContent=PIECES[color][type];
        btn.className=color==="w"?"white-piece":"black-piece";
        btn.addEventListener("click",()=>promote(type));
        promotionOptionsEl.appendChild(btn);
    });
    promotionEl.classList.add("show");
}

function promote(type) {
    const x=pendingPromotion;
    if(!x) return;

    board[x.tr][x.tc].type=type;
    pendingPromotion=null;
    promotionEl.classList.remove("show");

    const p={...board[x.tr][x.tc]};
    const hist=history[history.length-1];
    hist.notation=notation(x.fr,x.fc,x.tr,x.tc,{color:x.color,type:"p"},x.captured,x.castle,type);

    lastMove={from:{r:x.fr,c:x.fc},to:{r:x.tr,c:x.tc}};
    turn=opposite(turn);
    selected=null; legalMoves=[];

    const check=isInCheck(board,turn);
    const moves=allLegalMoves(board,turn);

    if(moves.length===0) {
        gameOver=true; stopTimer();
        statusEl.innerHTML=check ? "<strong>Jaque mate.</strong> Fin de la partida." : "<strong>Tablas.</strong>";
    } else {
        statusEl.textContent=check ? "<strong>Jaque.</strong>" : "Turno de " + (turn==="w" ? "las blancas." : "las negras.");
        if(check) statusEl.innerHTML="<strong>Jaque.</strong> El rey de " + (turn==="w" ? "las blancas" : "las negras") + " está amenazado.";
    }

    render();
    renderMoves();

    if (singlePlayer && !gameOver && turn !== humanColor) {
        scheduleAI();
    }
}

function renderMoves() {
    movesEl.innerHTML="";
    let count=0;
    history.forEach((h,i)=>{
        if(!h.notation) return;
        if(i%2===0) {
            const row=document.createElement("div");
            row.className="move-row";
            row.innerHTML=`<span class="move-number">${Math.floor(i/2)+1}.</span>
                           <span class="move">${h.notation}</span>
                           <span class="move" id="reply-${i}"></span>`;
            movesEl.appendChild(row);
        } else {
            const el=document.getElementById("reply-"+(i-1));
            if(el) el.textContent=h.notation;
        }
        count++;
    });
    moveCountEl.textContent=count;
    movesEl.scrollTop=movesEl.scrollHeight;
}

function undo() {
    if(!history.length || pendingPromotion) return;

    // En modo contra la IA se deshacen dos medios movimientos:
    // el movimiento de la computadora y el del jugador.
    let steps = singlePlayer ? Math.min(2, history.length) : 1;

    while (steps-- > 0) {
        const prev=history.pop();
        board=prev.board;
        turn=prev.turn;
        lastMove=prev.lastMove;
        clocks=prev.clocks;
    }

    gameOver=false;
    selected=null;
    legalMoves=[];
    statusEl.textContent="Movimiento deshecho. Turno de " + (turn==="w" ? "las blancas." : "las negras.");
    render();
    renderMoves();
    startTimer();

    if (singlePlayer && turn !== humanColor && !gameOver) scheduleAI();
}

function newGame() {
    if (aiTimer) {
        clearTimeout(aiTimer);
        aiTimer=null;
    }

    board=initialBoard();
    turn="w";
    selected=null;
    legalMoves=[];
    history=[];
    lastMove=null;
    flipped=false;
    pendingPromotion=null;
    gameOver=false;
    clocks={w:600,b:600};
    promotionEl.classList.remove("show");

    statusEl.textContent = singlePlayer
        ? "Modo contra la computadora. Tú juegas con blancas."
        : "Las blancas comienzan. Selecciona una pieza para ver sus movimientos.";

    updateModeButton();
    render();
    renderMoves();
    startTimer();
}

function updateModeButton() {
    const modeButton=document.getElementById("mode");
    if (!modeButton) return;
    modeButton.textContent = singlePlayer ? "👥 Dos jugadores" : "🤖 Jugar contra IA";
}

function toggleMode() {
    singlePlayer=!singlePlayer;
    newGame();
}

function scheduleAI() {
    if (aiTimer) clearTimeout(aiTimer);
    statusEl.textContent="La computadora está pensando...";
    aiTimer=setTimeout(()=>{
        aiTimer=null;
        if (!gameOver && singlePlayer && turn !== humanColor) makeAIMove();
    }, 350);
}

const PIECE_VALUE = {p:100,n:320,b:330,r:500,q:900,k:20000};

function evaluateBoard(b) {
    let score=0;
    for(let r=0;r<8;r++) for(let c=0;c<8;c++) {
        const p=b[r][c];
        if(!p) continue;
        let value=PIECE_VALUE[p.type];

        // Pequeños bonos de posición para que la IA valore el centro.
        if ((c===3 || c===4) && (r===3 || r===4)) value += 22;
        else if ((c===3 || c===4) && (r===2 || r===5)) value += 10;

        // Favorece avanzar peones y desarrollar piezas.
        if(p.type==="p") value += p.color==="w" ? (6-r)*3 : (r-1)*3;
        if(p.color==="w") score += value;
        else score -= value;
    }

    return score;
}

function minimax(b, depth, maximizing, alpha=-Infinity, beta=Infinity) {
    const color=maximizing ? "w" : "b";
    const moves=allLegalMoves(b,color);

    if(depth===0 || moves.length===0) {
        if(moves.length===0) {
            if(isInCheck(b,color)) return color==="w" ? -1000000-depth : 1000000+depth;
            return 0;
        }
        return evaluateBoard(b);
    }

    if(maximizing) {
        let best=-Infinity;
        for(const m of moves) {
            const nb=applyMove(b,m.fr,m.fc,m.tr,m.tc);
            const value=minimax(nb,depth-1,false,alpha,beta);
            best=Math.max(best,value);
            alpha=Math.max(alpha,best);
            if(beta<=alpha) break;
        }
        return best;
    } else {
        let best=Infinity;
        for(const m of moves) {
            const nb=applyMove(b,m.fr,m.fc,m.tr,m.tc);
            const value=minimax(nb,depth-1,true,alpha,beta);
            best=Math.min(best,value);
            beta=Math.min(beta,best);
            if(beta<=alpha) break;
        }
        return best;
    }
}

function makeAIMove() {
    if (gameOver || !singlePlayer || turn !== "b") return;

    const moves=allLegalMoves(board,"b");
    if(!moves.length) return;

    let bestScore=Infinity;
    let bestMoves=[];

    // Profundidad 2: suficiente para respuestas tácticas rápidas
    // sin hacer que el navegador se sienta lento.
    for(const m of moves) {
        const nb=applyMove(board,m.fr,m.fc,m.tr,m.tc);
        const score=minimax(nb,2,true);

        if(score<bestScore) {
            bestScore=score;
            bestMoves=[m];
        } else if(score===bestScore) {
            bestMoves.push(m);
        }
    }

    const m=bestMoves[Math.floor(Math.random()*bestMoves.length)];
    const p=board[m.fr][m.fc];
    const target=board[m.tr][m.tc];
    const castle=m.castle;

    history.push({
        board:cloneBoard(board),
        turn,
        lastMove:lastMove ? {...lastMove,from:{...lastMove.from},to:{...lastMove.to}} : null,
        clocks:{...clocks},
        notation:null
    });

    board=applyMove(board,m.fr,m.fc,m.tr,m.tc,{});
    board[m.tr][m.tc].moved=true;

    if(castle==="k") board[m.tr][5].moved=true;
    if(castle==="q") board[m.tr][3].moved=true;

    let aiPromotion=null;
    if(p.type==="p" && (m.tr===0 || m.tr===7)) {
        aiPromotion="q";
        board[m.tr][m.tc].type="q";
    }

    const moveNotation=notation(m.fr,m.fc,m.tr,m.tc,p,target,castle,aiPromotion);
    history[history.length-1].notation=moveNotation;
    lastMove={from:{r:m.fr,c:m.fc},to:{r:m.tr,c:m.tc}};
    turn="w";
    selected=null;
    legalMoves=[];

    const check=isInCheck(board,"w");
    const nextMoves=allLegalMoves(board,"w");

    if(nextMoves.length===0) {
        gameOver=true;
        stopTimer();
        statusEl.innerHTML=check
            ? "<strong>Jaque mate.</strong> La computadora gana la partida."
            : "<strong>Tablas.</strong> No hay movimientos legales.";
    } else if(check) {
        statusEl.innerHTML="<strong>Jaque.</strong> Tu rey está amenazado.";
    } else {
        statusEl.textContent="Tu turno. Selecciona una pieza para continuar.";
    }

    render();
    renderMoves();
}


function resign() {
    if(gameOver) return;
    gameOver=true;
    stopTimer();
    statusEl.innerHTML="<strong>Partida finalizada.</strong> " + (turn==="w" ? "Las negras" : "Las blancas") + " ganan por abandono.";
}

function updateClocks() {
    whiteClockEl.textContent=formatTime(clocks.w);
    blackClockEl.textContent=formatTime(clocks.b);
}

function formatTime(seconds) {
    seconds=Math.max(0,seconds);
    const m=Math.floor(seconds/60);
    const s=seconds%60;
    return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
}

function startTimer() {
    stopTimer();
    timer=setInterval(()=>{
        if(gameOver || pendingPromotion) return;
        clocks[turn]--;
        updateClocks();
        if(clocks[turn]<=0) {
            clocks[turn]=0;
            gameOver=true;
            stopTimer();
            statusEl.innerHTML="<strong>Tiempo agotado.</strong> " + (turn==="w" ? "Las negras" : "Las blancas") + " ganan.";
        }
    },1000);
}

function stopTimer() {
    if(timer) clearInterval(timer);
    timer=null;
}


function applyTheme(theme) {
    const isLight = theme === "light";
    document.body.classList.toggle("light-theme", isLight);

    const themeButton = document.getElementById("theme");
    if (themeButton) {
        themeButton.textContent = isLight ? "🌙 Tema oscuro" : "☀️ Tema claro";
    }

    localStorage.setItem("ajedrezTema", isLight ? "light" : "dark");
}

function toggleTheme() {
    const current = document.body.classList.contains("light-theme") ? "light" : "dark";
    applyTheme(current === "light" ? "dark" : "light");
}

document.getElementById("theme").addEventListener("click",toggleTheme);
document.getElementById("mode").addEventListener("click",toggleMode);
document.getElementById("newGame").addEventListener("click",newGame);
document.getElementById("undo").addEventListener("click",undo);
document.getElementById("flip").addEventListener("click",()=>{
    flipped=!flipped; render();
});
document.getElementById("resign").addEventListener("click",resign);

applyTheme(localStorage.getItem("ajedrezTema") || "dark");
newGame();
</script>
